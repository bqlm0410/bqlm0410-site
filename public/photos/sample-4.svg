<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="樱花小径占位图">
  <title>樱花小径（占位图）</title>
  <defs>
    <linearGradient id="p4-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3f6" />
      <stop offset="45%" stop-color="#ffd9e4" />
      <stop offset="100%" stop-color="#f7b6cd" />
    </linearGradient>
    <linearGradient id="p4-path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d8c6" />
      <stop offset="100%" stop-color="#e0b79f" />
    </linearGradient>
    <radialGradient id="p4-blob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="p4-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#p4-bg)" />
  <circle cx="250" cy="170" r="240" fill="url(#p4-blob)" />
  <circle cx="960" cy="120" r="200" fill="url(#p4-blob)" opacity="0.8" />
  <circle cx="640" cy="420" r="300" fill="url(#p4-blob)" opacity="0.6" />

  <path d="M470 800 L560 470 L640 470 L740 800 Z" fill="url(#p4-path)" opacity="0.85" />

  <g stroke="#c98aa2" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M120 800 C 160 640, 120 520, 190 430" />
    <path d="M1080 800 C 1040 650, 1090 520, 1010 420" />
  </g>
  <g fill="#f2a8c0" opacity="0.9">
    <circle cx="196" cy="418" r="58" />
    <circle cx="150" cy="470" r="42" />
    <circle cx="248" cy="462" r="38" />
    <circle cx="1006" cy="410" r="54" />
    <circle cx="1058" cy="468" r="40" />
    <circle cx="952" cy="462" r="36" />
  </g>
  <g fill="#ffe3ec" opacity="0.85" filter="url(#p4-soft)">
    <circle cx="196" cy="418" r="72" />
    <circle cx="1006" cy="410" r="68" />
  </g>

  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="330" cy="250" rx="14" ry="9" transform="rotate(-24 330 250)" />
    <ellipse cx="420" cy="330" rx="12" ry="8" transform="rotate(18 420 330)" />
    <ellipse cx="560" cy="200" rx="13" ry="8" transform="rotate(-8 560 200)" />
    <ellipse cx="700" cy="290" rx="12" ry="8" transform="rotate(28 700 290)" />
    <ellipse cx="860" cy="236" rx="14" ry="9" transform="rotate(-18 860 236)" />
    <ellipse cx="640" cy="560" rx="13" ry="8" transform="rotate(12 640 560)" />
    <ellipse cx="520" cy="660" rx="12" ry="8" transform="rotate(-30 520 660)" />
    <ellipse cx="760" cy="700" rx="13" ry="8" transform="rotate(22 760 700)" />
  </g>

  <g fill="#e78aa8" opacity="0.55">
    <ellipse cx="250" cy="620" rx="11" ry="7" transform="rotate(30 250 620)" />
    <ellipse cx="900" cy="600" rx="11" ry="7" transform="rotate(-26 900 600)" />
    <ellipse cx="380" cy="740" rx="10" ry="7" transform="rotate(16 380 740)" />
    <ellipse cx="1010" cy="720" rx="10" ry="7" transform="rotate(-14 1010 720)" />
  </g>
</svg>
