<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="海边日落占位图">
  <title>海边日落（占位图）</title>
  <defs>
    <linearGradient id="p2-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a4e" />
      <stop offset="34%" stop-color="#8d3f7c" />
      <stop offset="66%" stop-color="#e2683f" />
      <stop offset="100%" stop-color="#ffb35c" />
    </linearGradient>
    <linearGradient id="p2-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9d52" />
      <stop offset="28%" stop-color="#a8466d" />
      <stop offset="100%" stop-color="#1d1236" />
    </linearGradient>
    <linearGradient id="p2-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffb35c" stop-opacity="0" />
    </linearGradient>
    <filter id="p2-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#p2-sky)" />
  <circle cx="600" cy="470" r="118" fill="#ffe6a3" opacity="0.95" />
  <circle cx="600" cy="470" r="250" fill="#ffcf7a" opacity="0.38" filter="url(#p2-soft)" />

  <rect y="470" width="1200" height="330" fill="url(#p2-sea)" />
  <rect x="500" y="470" width="200" height="330" fill="url(#p2-glow)" opacity="0.6" filter="url(#p2-soft)" />

  <g stroke="#ffdca6" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M0 552 Q150 536 300 552 T600 552 T900 552 T1200 552" stroke-width="4" />
    <path d="M0 610 Q160 592 320 610 T640 610 T960 610 T1200 610" stroke-width="3.5" opacity="0.75" />
    <path d="M0 676 Q170 656 340 676 T680 676 T1020 676 T1200 676" stroke-width="3" opacity="0.55" />
    <path d="M0 742 Q180 722 360 742 T720 742 T1080 742 T1200 742" stroke-width="2.5" opacity="0.4" />
  </g>

  <g stroke="#3a1f42" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M232 214 q16 -16 32 0" />
    <path d="M276 186 q13 -13 26 0" />
    <path d="M330 246 q11 -11 22 0" />
  </g>
</svg>
