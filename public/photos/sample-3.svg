<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="深夜城市占位图">
  <title>深夜城市（占位图）</title>
  <defs>
    <linearGradient id="p3-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b1f" />
      <stop offset="52%" stop-color="#1b2350" />
      <stop offset="100%" stop-color="#4a3a72" />
    </linearGradient>
    <linearGradient id="p3-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3465" />
