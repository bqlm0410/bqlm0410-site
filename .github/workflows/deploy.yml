name: 部署到 Cloudflare Pages

# 为什么需要这个工作流？
#   本站是用「直接上传」方式部署到 Cloudflare Pages 的（没走控制台的 Git 集成，
#   因为那一步必须网页 OAuth 授权）。直接上传的代价是：git push 不会自动重新部署。
#   所以这里用 wrangler 在 CI 里完成同样的动作 ——
#   任何一次提交（包括每日抓取机器人提交的数据）都会触发重新构建 + 上线。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 连续推送时只保留最后一次部署，避免排队
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v7

      - name: 准备 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建站点（含 Pagefind 搜索索引）
        run: npm run build

      - name: 部署到 Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name=bqlm0410-site --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 输出部署摘要
        if: always()
        run: |
          echo "### 部署结果 🍓" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 提交：\`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 站点：https://bqlm0410.top" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -1 dist | head -20 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
